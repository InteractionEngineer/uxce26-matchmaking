services:
  matchmaking:
    build: .
    container_name: uxcamp-matchmaking
    volumes:
      - uxcamp-data:/data
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - EVENT=${EVENT:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - POLL_MS=${POLL_MS:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - LEGAL_NAME=${LEGAL_NAME}
      - LEGAL_STREET=${LEGAL_STREET}
      - LEGAL_CITY=${LEGAL_CITY}
      - LEGAL_COUNTRY=${LEGAL_COUNTRY}
      - LEGAL_EMAIL=${LEGAL_EMAIL}
    networks:
      - public_proxymanager

volumes:
  uxcamp-data:

networks:
  public_proxymanager:
    external: true
